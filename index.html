<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2024</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <center>
        <main class="game-shell">
            <header class="topbar">
                <div>
                    <p class="eyebrow">TILE SLIDER</p>
                    <h1>2024</h1>
                    <p class="subtitle">Merge. Think. Reach 2024.</p>
                </div>
                <div class="scores">
                    <div class="score-card">
                        <span>Score</span>
                        <strong id="score">0</strong>
                    </div>
                    <div class="score-card">
                        <span>Best</span>
                        <strong id="best-score">0</strong>
                    </div>
                </div>
            </header>
            <section class="control-row">
                <button id="new-game">New Game</button>
                <p id="message">Use the arrow keys to move.</p>
            </section>
            <section id="game-board" class="board" aria-label="2024 game board">
                
                </section>
                <footer class="help">
                    <p><b>How to play:</b> Use arrow keys or swipe. Equal tiles merge.</p>
                    <p>Reach <b>2024</b> to win.</p>
                </footer>
            </main>
        </center>
            <script src="script.js"></script>
        </body>
</html>
